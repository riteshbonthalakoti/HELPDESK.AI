name: Mobile APK

on:
  pull_request:
    branches: [main, gssoc]
    paths:
      - "MobileApp/**"
      - ".github/workflows/mobile-apk.yml"
  push:
    branches: [main]
    paths:
      - "MobileApp/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
  EXPO_PUBLIC_SUPABASE_ANON_KEY: "placeholder_key"
  EXPO_PUBLIC_BACKEND_URL: "http://localhost:7860"

jobs:
  mobile-test:
    name: Mobile Tests (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MobileApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: MobileApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest
        run: npm test -- --ci

  mobile-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: mobile-test
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: MobileApp/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        working-directory: MobileApp
        run: npm ci

      - name: Generate native Android project
        working-directory: MobileApp
        run: npx expo prebuild --platform android --no-install

      - name: Choose signing mode
        id: mode
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "type=release" >> "$GITHUB_OUTPUT"
          else
            echo "type=qa" >> "$GITHUB_OUTPUT"
          fi

      # A bundled (release) build is used even without secrets: the standard debug
      # variant does not embed the JS bundle and would need a Metro dev server.
      # Without secrets, Expo's generated project signs release with the debug key.
      - name: Build bundled APK
        working-directory: MobileApp/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign with release keystore
        if: steps.mode.outputs.type == 'release'
        working-directory: MobileApp/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          K_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OUT=app/build/outputs/apk/release
          "$BT/zipalign" -p -f 4 "$OUT/app-release.apk" "$OUT/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:K_PASS \
            --out "$OUT/helpdesk-ai-release.apk" "$OUT/aligned.apk"
          rm "$OUT/app-release.apk" "$OUT/aligned.apk"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Name QA APK
        if: steps.mode.outputs.type == 'qa'
        working-directory: MobileApp/android/app/build/outputs/apk/release
        run: mv app-release.apk helpdesk-ai-qa.apk

      - name: Verify APK signature
        working-directory: MobileApp/android/app/build/outputs/apk/release
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs *.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: helpdesk-ai-${{ steps.mode.outputs.type }}-apk
          path: MobileApp/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14