name: Dependency Security Scanning

on:
  push:
    branches: [ "main", "master", "gssoc" ]
  pull_request:
    branches: [ "main", "master", "gssoc" ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  scan-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit for Backend
        if: hashFiles('backend/requirements.txt') != ''
        working-directory: ./backend
        run: pip-audit -r requirements.txt || true

      - name: Run pip-audit for Model
        run: |
          if [ -d "Model" ] && [ -f "Model/requirements.txt" ]; then
            pip-audit -r Model/requirements.txt
          fi || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run npm audit for Frontend
        if: hashFiles('Frontend/package.json') != ''
        working-directory: ./Frontend
        run: npm audit || true

      - name: Run npm audit for MobileApp
        if: hashFiles('MobileApp/package.json') != ''
        working-directory: ./MobileApp
        run: npm audit || true
        
      - name: Run npm audit for Root
        if: hashFiles('package.json') != ''
        run: npm audit || true
