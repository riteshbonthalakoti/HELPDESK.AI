name: Markdown Lint
on: [push, pull_request]
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          config: '.markdownlint-cli2.jsonc'
          globs: '**/*.md'
