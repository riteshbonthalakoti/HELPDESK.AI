name: Contributor Compliance Triage

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  compliance-triage:
    name: Audit Contributor Onboarding Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Compliance Triage Check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            echo "Triaging Issue #${{ github.event.issue.number }}..."
            python scripts/contributor_compliance_triage.py --issue ${{ github.event.issue.number }} --apply
          elif [ "${{ github.event_name }}" = "pull_request_target" ]; then
            echo "Triaging Pull Request #${{ github.event.pull_request.number }}..."
            python scripts/contributor_compliance_triage.py --pr ${{ github.event.pull_request.number }} --apply
          else
            echo "Manual trigger — executing full compliance sweep..."
            python scripts/contributor_compliance_triage.py --apply
          fi
