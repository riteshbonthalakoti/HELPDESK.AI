name: WOCS 2026 Autonomous Issue Auto-Claimer

on:
  schedule:
    # Run every 5 minutes 24/7 on GitHub Cloud
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  claim-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan and Auto-Claim High-Priority WOCS Issues
        env:
          GH_TOKEN: ${{ secrets.WOCS_BOT_PAT }}
        run: |
          python - << 'EOF'
          import subprocess
          import json
          import time
          import os

          def run_cmd(cmd):
              try:
                  res = subprocess.run(cmd, capture_output=True, text=True, check=False)
                  return res.returncode, res.stdout, res.stderr
              except Exception as e:
                  return 1, "", str(e)

          def claim_issue(repo, number, title, labels):
              print(f"[*] Auto-Claiming #{number} on {repo}: {title}")
              body = (
                  "Hi! I would like to work on this issue under WOCS 2026. "
                  "I have extensive experience in this architecture and will implement a robust, production-grade solution with complete unit test coverage.\n\n"
                  "/claim"
              )
              code, stdout, stderr = run_cmd(["gh", "issue", "comment", str(number), "--repo", repo, "--body", body])
              if code == 0:
                  print(f"[+] Successfully claimed #{number} on {repo}!")
                  return True
              else:
                  print(f"[-] Failed to claim #{number} on {repo}: {stderr.strip()}")
                  return False

          def main():
              print("Starting WOCS Issue Auto-Claimer scan...")
              queries = [
                  ["gh", "search", "issues", "--label", "wocs", "--state", "open", "--limit", "50", "--json", "repository,number,title,labels,assignees"],
                  ["gh", "search", "issues", "wocs in:title,body", "--state", "open", "--limit", "40", "--json", "repository,number,title,labels,assignees"]
              ]
              
              seen_issues = {}
              for q in queries:
                  code, stdout, stderr = run_cmd(q)
                  if code == 0:
                      try:
                          items = json.loads(stdout)
                          for item in items:
                              repo_name = item.get("repository", {}).get("nameWithOwner")
                              if not repo_name:
                                  continue
                              num = item["number"]
                              key = f"{repo_name}#{num}"
                              if key not in seen_issues:
                                  seen_issues[key] = item
                      except Exception as e:
                          print(f"Error parsing json: {e}")

              print(f"Analyzed {len(seen_issues)} total candidates.")
              claims_made = 0

              for key, item in seen_issues.items():
                  repo_name = item["repository"]["nameWithOwner"]
                  num = item["number"]
                  title = item["title"]
                  labels = [l["name"].lower() for l in item.get("labels", [])]
                  assignees = [a["login"].lower() for a in item.get("assignees", [])]
                  
                  if "riteshbonthalakoti" in repo_name.lower():
                      continue
                      
                  # If already assigned, skip
                  if len(assignees) > 0:
                      continue

                  # Check for wocs + level 3 / level 2
                  is_wocs = any("wocs" in l for l in labels) or "wocs" in title.lower()
                  is_level_3 = any("level 3" in l or l == "l3" for l in labels)
                  is_level_2 = any("level 2" in l or l == "l2" for l in labels)

                  if is_wocs and (is_level_3 or is_level_2):
                      # Check if riteshbonthalakoti already commented on this issue
                      code, comments_out, _ = run_cmd(["gh", "issue", "view", str(num), "--repo", repo_name, "--json", "comments"])
                      already_commented = False
                      if code == 0:
                          try:
                              issue_data = json.loads(comments_out)
                              for comment in issue_data.get("comments", []):
                                  if comment.get("author", {}).get("login", "").lower() == "riteshbonthalakoti":
                                      already_commented = True
                                      break
                          except Exception:
                              pass
                      
                      if already_commented:
                          continue

                      print(f"[!] Target match found: {key} - {title}")
                      if claim_issue(repo_name, num, title, labels):
                          claims_made += 1
                          time.sleep(3)

              print(f"Completed run. Claims made in this pass: {claims_made}")

          if __name__ == "__main__":
              main()
          EOF
