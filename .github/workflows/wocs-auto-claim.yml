name: WOCS 2026 Autonomous Issue Auto-Claimer

on:
  schedule:
    # Run every 5 minutes 24/7 on GitHub Cloud
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  claim-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan and Auto-Claim High-Priority WOCS Issues
        env:
          GH_TOKEN: ${{ secrets.WOCS_BOT_PAT }}
        run: |
          python - << 'EOF'
          import subprocess
          import json
          import time
          import os

          # Participating WOCS 2026 & Partner Ecosystem Repositories
          TARGET_REPOS = [
              "SatyamPandey-07/WorkSphere",
              "phravins/QuantumBilling",
              "kismatkumari56/AI-Resume-Analyzer",
              "shashankkshyp/Nexus",
              "saurabhwagh01/smart-connectivity-analyser",
              "GianlucaBave/murmury",
              "palchhinparihar/WordWizard",
              "DYHARDx/BYAMN-Learning",
              "janavipandole/Foodie",
              "mannubaveja007/Auralis",
              "AseemPrasad/circularfashion",
              "shreejas18/WOCS"
          ]

          def run_cmd(cmd):
              try:
                  res = subprocess.run(cmd, capture_output=True, text=True, check=False)
                  return res.returncode, res.stdout, res.stderr
              except Exception as e:
                  return 1, "", str(e)

          def claim_issue(repo, number, title, labels):
              print(f"[*] Auto-Claiming #{number} on {repo}: {title}")
              body = (
                  "Hi! I would like to work on this issue under WOCS 2026. "
                  "I have extensive experience in this architecture and will implement a robust, production-grade solution with complete unit test coverage.\n\n"
                  "/claim"
              )
              code, stdout, stderr = run_cmd(["gh", "issue", "comment", str(number), "--repo", repo, "--body", body])
              if code == 0:
                  print(f"[+] Successfully claimed #{number} on {repo}!")
                  return True
              else:
                  print(f"[-] Failed to claim #{number} on {repo}: {stderr.strip()}")
                  return False

          def main():
              print("Starting Real-Time WOCS Issue Scanner across target repositories...")
              claims_made = 0

              for repo in TARGET_REPOS:
                  print(f"Scanning {repo}...")
                  cmd = ["gh", "issue", "list", "--repo", repo, "--state", "open", "--limit", "15", "--json", "number,title,labels,assignees"]
                  code, stdout, stderr = run_cmd(cmd)
                  if code != 0:
                      print(f"  Warning scanning {repo}: {stderr.strip()}")
                      continue

                  try:
                      issues = json.loads(stdout)
                  except Exception as e:
                      print(f"  JSON parse error for {repo}: {e}")
                      continue

                  for iss in issues:
                      num = iss["number"]
                      title = iss["title"]
                      labels = [l["name"].lower() for l in iss.get("labels", [])]
                      assignees = [a["login"].lower() for a in iss.get("assignees", [])]

                      # If already assigned to someone, skip
                      if len(assignees) > 0:
                          continue

                      # Check if issue qualifies for WOCS Level 3 or Level 2
                      is_wocs = any("wocs" in l for l in labels) or "wocs" in title.lower() or repo == "SatyamPandey-07/WorkSphere"
                      is_level_3 = any("level 3" in l or l == "l3" for l in labels)
                      is_level_2 = any("level 2" in l or l == "l2" for l in labels)

                      if is_wocs and (is_level_3 or is_level_2):
                          # Check if riteshbonthalakoti already commented on this issue
                          code, comments_out, _ = run_cmd(["gh", "issue", "view", str(num), "--repo", repo, "--json", "comments"])
                          already_commented = False
                          if code == 0:
                              try:
                                  issue_data = json.loads(comments_out)
                                  for comment in issue_data.get("comments", []):
                                      if comment.get("author", {}).get("login", "").lower() == "riteshbonthalakoti":
                                          already_commented = True
                                          break
                              except Exception:
                                  pass

                          if already_commented:
                              continue

                          print(f"[!] Target match found: {repo}#{num} - {title} (labels: {labels})")
                          if claim_issue(repo, num, title, labels):
                              claims_made += 1
                              time.sleep(2)

              print(f"Completed run. New claims made in this pass: {claims_made}")

          if __name__ == "__main__":
              main()
          EOF
