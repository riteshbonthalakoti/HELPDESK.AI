name: Unified CI

on:
  push:
    branches:
      - main
      - gssoc
      - "fix/**"
      - "feat/**"
      - "test/**"
      - "perf/**"
      - "security/**"
      - "docs/**"
      - "devops/**"
  pull_request:
    branches:
      - main
      - gssoc
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  # ── Backend: Lint + Test ───────────────────────────────────────────────────
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    env:
      ALLOW_DEGRADED_STARTUP: "1"
      SUPABASE_URL: "https://placeholder.supabase.co"
      SUPABASE_SERVICE_KEY: "placeholder_key"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check backend/ --output-format=github

      - name: Install dependencies (CI subset)
        run: |
          pip install --upgrade pip
          pip install fastapi uvicorn pydantic pydantic-settings python-dotenv slowapi structlog \
                      supabase==2.22.4 storage3==2.22.4 \
                      requests httpx apscheduler \
                      pytest pytest-cov
          pip install -r requirements.txt --ignore-requires-python || true

      - name: Run import smoke test
        run: python scripts/smoke_test.py

      - name: Run unit tests with coverage
        run: |
          pytest backend/tests/test_import_smoke.py \
            --cov=backend/services \
            --cov-report=term-missing \
            -v

  # ── Frontend: Lint + Test + Build ──────────────────────────────────────────
  frontend:
    name: Frontend (ESLint + Vitest + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    env:
      VITE_SUPABASE_URL: "https://placeholder.supabase.co"
      VITE_SUPABASE_ANON_KEY: "placeholder_key"
      VITE_API_URL: "http://localhost:7860"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint src/ --max-warnings=0

      - name: Run Vitest
        run: npx vitest run --reporter=verbose --passWithNoTests || true

      - name: Build check
        run: npm run build

  # ── MobileApp: Test ────────────────────────────────────────────────────────
  mobile:
    name: MobileApp (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MobileApp

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: MobileApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npx jest --passWithNoTests --verbose || true

  # ── Summary job for branch protection ─────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend, mobile]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Backend: ${{ needs.backend.result }}"
          echo "Frontend: ${{ needs.frontend.result }}"
          echo "Mobile: ${{ needs.mobile.result }}"
          if [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.mobile.result }}" != "success" ]; then
            echo "One or more CI checks failed"
            exit 1
          fi
          echo "All CI checks passed!"
