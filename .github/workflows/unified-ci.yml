name: Unified CI

on:
  push:
    branches:
      - main
      - gssoc
      - "fix/**"
      - "feat/**"
      - "test/**"
      - "perf/**"
      - "security/**"
      - "docs/**"
      - "devops/**"
  pull_request:
    branches:
      - main
      - gssoc
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  # ── Backend: Lint + Test ───────────────────────────────────────────────────
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    env:
      ALLOW_DEGRADED_STARTUP: "1"
      SUPABASE_URL: "https://placeholder.supabase.co"
      SUPABASE_SERVICE_KEY: "placeholder_key"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check backend/ --output-format=github

      - name: Install dependencies (CI subset)
        run: |
          pip install --upgrade pip
          pip install fastapi uvicorn pydantic pydantic-settings python-dotenv slowapi structlog \
                      supabase==2.22.4 storage3==2.22.4 \
                      requests httpx apscheduler \
                      pytest pytest-cov
          pip install -r requirements.txt --ignore-requires-python || true

      - name: Run import smoke test
        run: python scripts/smoke_test.py

      - name: Run unit tests with coverage
        run: |
          pytest backend/tests/test_import_smoke.py \
            --cov=backend/services \
            --cov-report=term-missing \
            -v

  # ── Frontend: Lint + Test + Build ──────────────────────────────────────────
  frontend:
    name: Frontend (ESLint + Vitest + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    env:
      VITE_SUPABASE_URL: "https://placeholder.supabase.co"
      VITE_SUPABASE_ANON_KEY: "placeholder_key"
      VITE_API_URL: "http://localhost:7860"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint src/ --max-warnings=0

      - name: Run Vitest
        run: npx vitest run --reporter=verbose --passWithNoTests || true

      - name: Build check
        run: npm run build

  # ── MobileApp: Test ────────────────────────────────────────────────────────
  mobile:
    name: MobileApp (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MobileApp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: MobileApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npx jest --passWithNoTests --verbose || true

  # ── Cypress Full-Stack E2E ─────────────────────────────────────────────────
  cypress-e2e:
    name: Cypress E2E (Signup + Tickets + Agent + Admin)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALLOW_DEGRADED_STARTUP: "1"
      E2E_SUPABASE_URL: "http://127.0.0.1:54321"
      E2E_SUPABASE_ANON_KEY: "e2e-header.e2e-payload.e2e-signature"
      E2E_BACKEND_URL: "http://127.0.0.1:8000"
      E2E_FRONTEND_URL: "http://localhost:5173"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - name: Install headless browser system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgbm-dev libnotify-dev libnss3 libxss1 libxtst6 xauth
          sudo apt-get install -y --no-install-recommends libgtk-3-0t64 || sudo apt-get install -y --no-install-recommends libgtk-3-0
          sudo apt-get install -y --no-install-recommends libasound2t64 || sudo apt-get install -y --no-install-recommends libasound2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "scripts/requirements-e2e.txt"

      - name: Install backend Python dependencies
        run: |
          python -m pip install --only-binary :all: --require-hashes -r scripts/requirements-e2e.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('Frontend/package-lock.json') }}

      - name: Install Frontend & Cypress dependencies
        working-directory: Frontend
        run: |
          npm ci --ignore-scripts
          node ./node_modules/cypress/bin/cypress install
          node ./node_modules/cypress/bin/cypress verify

      - name: Run full-stack Cypress E2E suite
        env:
          PYTHON_BIN: python
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            node scripts/run_e2e_ci.mjs

      - name: Upload Cypress failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unified-ci-cypress-artifacts
          path: |
            Frontend/cypress/screenshots
            Frontend/cypress/videos
          if-no-files-found: ignore

  # ── Summary job for branch protection ─────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend, mobile, cypress-e2e]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Backend: ${{ needs.backend.result }}"
          echo "Frontend: ${{ needs.frontend.result }}"
          echo "Mobile: ${{ needs.mobile.result }}"
          echo "Cypress E2E: ${{ needs.cypress-e2e.result }}"
          if [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.mobile.result }}" != "success" ] || \
             [ "${{ needs.cypress-e2e.result }}" != "success" ]; then
            echo "One or more CI checks failed"
            exit 1
          fi
          echo "All CI checks passed!"
