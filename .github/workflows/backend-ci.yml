name: Backend CI

on:
  push:
    branches:
      - main
      - gssoc      
      - "fix/**"
      - "feat/**"
      - "test/**"
      - "perf/**"
      - "security/**"
      - "docs/**"
      - "devops/**"
  pull_request:
    branches:
      - main
      - gssoc
  workflow_dispatch:

permissions:
  contents: read


jobs:
  backend-lint:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff linter
        run: ruff check backend/ --output-format=github
  smoke-test:
    name: Smoke Test & Unit Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    env:
      ALLOW_DEGRADED_STARTUP: "1"
      SUPABASE_URL: "https://placeholder.supabase.co"
      SUPABASE_SERVICE_KEY: "placeholder_key"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies (non-ML subset for CI speed)
        run: |
          pip install --upgrade pip
          # Install a lighter subset that still covers service imports
          pip install fastapi uvicorn pydantic pydantic-settings python-dotenv slowapi structlog \
                      supabase==2.22.4 storage3==2.22.4 \
                      requests httpx apscheduler \
                      pytest pytest-cov
          # Try full requirements but tolerate torch/transformers failures in CI
          pip install -r requirements.txt --ignore-requires-python || true

      - name: Run import smoke test
        run: python scripts/smoke_test.py

      - name: Run unit tests with coverage
        run: |
          pytest backend/tests/test_import_smoke.py \
            --cov=backend/services \
            --cov-report=term-missing \
            -v
