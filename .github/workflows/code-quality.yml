name: Code Quality Checks (SonarQube)

on:
  push:
    branches: [main, master, gssoc]
  pull_request:
    branches: [main, master, gssoc]

jobs:
  sonarcloud:
    name: SonarQube / SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Check SonarCloud Configuration
        id: check_sonar
        run: |
          if [ -n "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::notice ::SONAR_TOKEN secret is not configured; skipping SonarCloud scan."
          fi

      - name: SonarCloud Scan
        if: steps.check_sonar.outputs.has_token == 'true'
        uses: SonarSource/sonarcloud-github-action@master
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=HELPDESK-AI
            -Dsonar.organization=helpdesk-ai
            -Dsonar.sources=Frontend,backend
            -Dsonar.exclusions=**/node_modules/**,**/venv/**,**/__pycache__/**
